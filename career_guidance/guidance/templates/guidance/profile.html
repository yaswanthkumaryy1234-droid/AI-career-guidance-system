{% extends 'base.html' %}
{% block title %}My Profile{% endblock %}

{% block content %}
<style>
.profile-card{
  max-width:600px;
  margin:auto;
  background:#fff;
  padding:30px;
  border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}
.profile-card h2{margin-bottom:20px;}
.profile-item{margin-bottom:10px;}
.action-btn{
  display:inline-block;
  padding:10px 18px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  border-radius:6px;
}
</style>

<div class="profile-card">
  <h2>👤 My Profile</h2>

  <div class="profile-item"><strong>First Name:</strong> {{ user.first_name }}</div>
  <div class="profile-item"><strong>Last Name:</strong> {{ user.last_name }}</div>
  <div class="profile-item"><strong>Email:</strong> {{ user.email }}</div>
  <div class="profile-item"><strong>Username:</strong> {{ user.username }}</div>

  <br>
  <a href="{% url 'profile_update' %}" class="action-btn">✏️ Edit Profile</a>
  <a href="{% url 'change_password' %}" class="action-btn" style="background:#dc2626;">🔒 Change Password</a>
</div>
{% endblock %}
