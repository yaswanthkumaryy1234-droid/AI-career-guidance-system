<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}AI Career Guidance System{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 15px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        nav {
            margin-top: 8px;
        }

        nav a {
            color: #e5e7eb;
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .message-success {
            color: green;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .message-error {
            color: red;
            font-weight: bold;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #e5e7eb;
            margin-top: 40px;
            font-size: 14px;
        }

        input, button {
            padding: 8px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 10px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }
    </style>
</head>
<body>

<header>
    <h1>🎓 AI-Based Career Guidance System</h1>

    <nav>
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'profile' %}">Profile</a>
            <a href="{% url 'change_password' %}">Change Password</a>
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'signup' %}">Signup</a>
        {% endif %}
    </nav>
</header>

<div class="container">

    {% if messages %}
        {% for message in messages %}
            <div class="{% if message.tags == 'success' %}message-success{% else %}message-error{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</div>

<footer>
   AI Based Career Guidance System
</footer>

</body>
</html>
